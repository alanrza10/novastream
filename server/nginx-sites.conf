# Nginx: drie merken op één VPS, plus het adminpanel.
# Vervang de drie domeinen door je eigen domeinen en zet dit bestand in
# /etc/nginx/sites-available/novastream, met een symlink in sites-enabled.
# SSL-certificaten komen daarna van certbot (zie INSTALLATIE.md); certbot past deze blokken zelf aan.

# Gedeeld stuk: adminpanel en instellingen via het Node-programma op poort 3000.
# X-Merk vertelt het programma om welk merk het gaat.
map $host $merk {
    default              odysstream;
    odysstream.com        odysstream;
    www.odysstream.com    odysstream;
    thuisplay.com         thuisplay;
    www.thuisplay.com     thuisplay;
    spitstv.com           spitstv;
    www.spitstv.com       spitstv;
}

server {
    listen 80;
    listen [::]:80;
    server_name odysstream.com www.odysstream.com;
    root /var/www/novastream;
    include /etc/nginx/snippets/novastream-gedeeld.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name thuisplay.com www.thuisplay.com;
    root /var/www/novastream/thuisplay;
    include /etc/nginx/snippets/novastream-gedeeld.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name spitstv.com www.spitstv.com;
    root /var/www/novastream/spitstv;
    include /etc/nginx/snippets/novastream-gedeeld.conf;
}
