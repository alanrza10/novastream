# Wordt door elk server-blok ingelezen. Zet dit in /etc/nginx/snippets/novastream-gedeeld.conf
index index.html;
charset utf-8;

# statische bestanden: lang cachen, html zelf niet
location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
}

# instellingen uit het adminpanel (nooit cachen)
location = /instellingen.json {
    proxy_pass http://127.0.0.1:3000/instellingen.json;
    proxy_set_header X-Merk $merk;
    proxy_set_header Host $host;
    add_header Cache-Control "no-cache";
}

# het beheerpaneel en zijn api
location ^~ /admin/ {
    proxy_pass http://127.0.0.1:3000/admin/;
    proxy_set_header X-Merk $merk;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location = /admin { return 301 /admin/; }
location ^~ /api/ {
    proxy_pass http://127.0.0.1:3000/api/;
    proxy_set_header X-Merk $merk;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# de sites zelf
location / {
    try_files $uri $uri/ =404;
}

# de submappen van de andere merken niet via dit domein tonen
location ~ ^/(thuisplay|spitstv|server)/ { return 404; }
