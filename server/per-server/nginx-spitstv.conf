# Nginx voor de server van spitstv (spitstv.com). Zet dit bestand in
# /etc/nginx/sites-available/spitstv, met een symlink in sites-enabled. Zie INSTALLATIE.md.
map $host $merk { default spitstv; }

server {
    listen 80;
    listen [::]:80;
    server_name spitstv.com www.spitstv.com;
    root /var/www/novastream/spitstv;
    include /etc/nginx/snippets/novastream-gedeeld.conf;
}
