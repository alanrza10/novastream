# Nginx voor de server van odysstream (odysstream.com). Zet dit bestand in
# /etc/nginx/sites-available/odysstream, met een symlink in sites-enabled. Zie INSTALLATIE.md.
map $host $merk { default odysstream; }

server {
    listen 80;
    listen [::]:80;
    server_name odysstream.com www.odysstream.com;
    root /var/www/novastream;
    include /etc/nginx/snippets/novastream-gedeeld.conf;
}
