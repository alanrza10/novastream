# Nginx voor de server van thuisplay (thuisplay.com). Zet dit bestand in
# /etc/nginx/sites-available/thuisplay, met een symlink in sites-enabled. Zie INSTALLATIE.md.
map $host $merk { default thuisplay; }

server {
    listen 80;
    listen [::]:80;
    server_name thuisplay.com www.thuisplay.com;
    root /var/www/novastream/thuisplay;
    include /etc/nginx/snippets/novastream-gedeeld.conf;
}
